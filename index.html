<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tour Guide Journey of Franciss Nerosa — explore mountain destinations and open directions in Google Maps.">
  <title>Tour Guide Journey of Franciss Nerosa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">EXPLORE • HIKE • DISCOVER</p>
    <h1>Tour Guide Journey <span>of Franciss Nerosa</span></h1>
    <p class="intro">A small collection of mountain destinations to explore around Davao and beyond.</p>
  </header>

  <main>
    <section class="journey-grid" aria-label="Mountain destinations">
      <button class="destination-card card-loay" data-destination="Mt. Loay Nature Park, Davao del Sur, Philippines" aria-label="Open navigation to Mt. Loay Nature Park">
        <img src="images/mt-loay.jpg" alt="Mountain scenery at Mt. Loay Nature Park">
        <span class="card-content">
          <span class="destination-name">Mt. Loay Nature Park</span>
          <span class="rating"><strong>4.7</strong> <span class="stars">★★★★★</span> <span class="reviews">(120)</span></span>
          <span class="category">Hiking area</span>
          <span class="location">VCM5+J6J · Davao del Sur</span>
          <span class="open-map">Open directions <span aria-hidden="true">↗</span></span>
        </span>
      </button>

      <button class="destination-card card-dinor" data-destination="Mt. Dinor Peak, Davao del Sur, Philippines" aria-label="Open navigation to Mt. Dinor Peak">
        <img src="images/mt-dinor.jpg" alt="Green mountain ridges at Mt. Dinor Peak">
        <span class="card-content">
          <span class="destination-name">Mt. Dinor Peak</span>
          <span class="rating"><strong>4.8</strong> <span class="stars">★★★★★</span> <span class="reviews">(45)</span></span>
          <span class="category">Nature preserve</span>
          <span class="location">V9WQ+PFV · Davao del Sur</span>
          <span class="open-map">Open directions <span aria-hidden="true">↗</span></span>
        </span>
      </button>

      <button class="destination-card card-fortune" data-destination="Mt. Fortune View, Davao del Sur, Philippines" aria-label="Open navigation to Mt. Fortune View">
        <img src="images/mt-fortune-view.jpg" alt="Forest scenery at Mt. Fortune View">
        <span class="card-content">
          <span class="destination-name">Mt. Fortune View</span>
          <span class="rating"><strong>5.0</strong> <span class="stars">★★★★★</span> <span class="reviews">(1)</span></span>
          <span class="category">Hiking area</span>
          <span class="location">VC9Q+7X3 · Davao del Sur</span>
          <span class="open-map">Open directions <span aria-hidden="true">↗</span></span>
        </span>
      </button>

      <button class="destination-card card-apo" data-destination="Mount Apo, Davao City, Davao del Sur, Philippines" aria-label="Open navigation to Mount Apo">
        <img src="images/mount-apo.jpg" alt="Mountain lake and green peaks at Mount Apo">
        <span class="card-content">
          <span class="destination-name">Mount Apo</span>
          <span class="rating"><strong>4.6</strong> <span class="stars">★★★★☆</span> <span class="reviews">(522)</span></span>
          <span class="category">Volcano</span>
          <span class="location">Davao City / Davao del Sur</span>
          <span class="open-map">Open directions <span aria-hidden="true">↗</span></span>
        </span>
      </button>
    </section>

    <p class="map-note"><span class="pin">↗</span> Select any destination card to open Google Maps directions in a new tab.</p>
  </main>

  <footer>
    <span>© <span id="year"></span> Franciss Nerosa</span>
    <span>Made for the journey 🌿</span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
